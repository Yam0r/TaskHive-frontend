<main class="main-content">
  <div class="header">
    <app-header [title]="'calendar.title' | transloco"></app-header>
    <button type="button" class="btn-primary" (click)="openCreate()">{{ 'tasks.newTask' | transloco }}</button>
  </div>

  <div class="calendar-page">
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-title">{{ 'calendar.deadlinesThisMonth' | transloco }}</span>
        <span class="stat-value">{{ deadlinesThisMonth() }}</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">{{ 'calendar.overdue' | transloco }}</span>
        <span class="stat-value" [class.danger]="overdue() > 0">{{ overdue() }}</span>
      </div>
    </div>

    @if (loadError()) {
      <p class="load-error" role="alert">{{ 'common.loadError' | transloco }}</p>
    }

    <div class="full-calendar-container">
      <full-calendar [options]="calendarOptions()"></full-calendar>
    </div>
  </div>

  @if (dialogOpen()) {
    <app-task-dialog [task]="dialogTask()" [date]="dialogDate()" (closed)="closeDialog()"></app-task-dialog>
  }
</main>
