<main class="main-content">
  <app-header [title]="'dashboard.title' | transloco"></app-header>

  <div class="dashboard-area">
    @if (loadError()) {
      <p class="load-error" role="alert">{{ 'common.loadError' | transloco }}</p>
    }

    <div class="stats-grid">
      <app-stat-card [title]="'dashboard.totalTasks' | transloco" [count]="stats().totalTasks ?? 0" iconName="adjust" colorType="primary"></app-stat-card>
      <app-stat-card [title]="'status.NOT_STARTED' | transloco" [count]="stats().notStartedTasks ?? 0" iconName="radio_button_unchecked" colorType="warning"></app-stat-card>
      <app-stat-card [title]="'status.IN_PROGRESS' | transloco" [count]="stats().inProgressTasks ?? 0" iconName="tonality" colorType="info"></app-stat-card>
      <app-stat-card [title]="'status.COMPLETED' | transloco" [count]="stats().completedTasks ?? 0" iconName="check_circle_outline" colorType="success"></app-stat-card>
    </div>

    <div class="charts-section">
      <div class="card activity-chart">
        <app-activity-chart></app-activity-chart>
      </div>
      <div class="card status-chart">
        <app-status-chart [stats]="stats()"></app-status-chart>
      </div>
    </div>

    <div class="lists-section">
      <div class="card deadlines-card">
        <app-deadline-list></app-deadline-list>
      </div>
      <div class="card projects-card">
        <app-project-list></app-project-list>
      </div>
    </div>
  </div>
</main>
