<main class="main-content">
  <app-header [title]="'settings.title' | transloco"></app-header>

  <div class="dashboard-area settings">
    <section class="settings-section">
      <div class="section-header">
        <h2>{{ 'settings.appearance' | transloco }}</h2>
        <p>{{ 'settings.appearanceHint' | transloco }}</p>
      </div>

      <div class="theme-options" role="radiogroup" [attr.aria-label]="'settings.theme' | transloco">
        @for (option of themeOptions; track option) {
          <button
            type="button"
            class="theme-option"
            role="radio"
            [class.selected]="theme() === option"
            [attr.aria-checked]="theme() === option"
            (click)="setTheme(option)"
          >
            <span [class]="'preview preview-' + option" aria-hidden="true">
              <span class="preview-sidebar"></span>
              <span class="preview-content">
                <span class="preview-card"></span>
                <span class="preview-card"></span>
              </span>
            </span>
            <span class="option-label">{{ 'settings.' + option | transloco }}</span>
          </button>
        }
      </div>
    </section>

    <section class="settings-section">
      <div class="section-header">
        <h2>{{ 'settings.language' | transloco }}</h2>
        <p>{{ 'settings.languageHint' | transloco }}</p>
      </div>

      <div class="language-options" role="radiogroup" [attr.aria-label]="'settings.language' | transloco">
        @for (option of languageOptions; track option.value) {
          <button
            type="button"
            class="language-option"
            role="radio"
            [class.selected]="language() === option.value"
            [attr.aria-checked]="language() === option.value"
            [attr.lang]="option.value"
            (click)="setLanguage(option.value)"
          >
            <span class="language-code">{{ option.value }}</span>
            <span class="option-label">{{ option.label }}</span>
          </button>
        }
      </div>
    </section>
  </div>
</main>
