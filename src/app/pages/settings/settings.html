<main class="main-content">
  <app-header title="Settings"></app-header>

  <div class="dashboard-area settings">
    <section class="settings-section">
      <div class="section-header">
        <h2>Appearance</h2>
        <p>Choose how TaskHive looks on this device.</p>
      </div>

      <div class="theme-options" role="radiogroup" aria-label="Theme">
        @for (option of themeOptions; track option.value) {
          <button
            type="button"
            class="theme-option"
            role="radio"
            [class.selected]="theme() === option.value"
            [attr.aria-checked]="theme() === option.value"
            (click)="setTheme(option.value)"
          >
            <span [class]="'preview preview-' + option.value" aria-hidden="true">
              <span class="preview-sidebar"></span>
              <span class="preview-content">
                <span class="preview-card"></span>
                <span class="preview-card"></span>
              </span>
            </span>
            <span class="option-label">{{ option.label }}</span>
          </button>
        }
      </div>
    </section>
  </div>
</main>
