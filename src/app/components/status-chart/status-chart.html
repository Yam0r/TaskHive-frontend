<div class="chart-header">
  <h3 class="chart-title">Статусы</h3>
  <span class="chart-subtitle">Распределение задач</span>
</div>

<div class="chart-content">
  <div class="canvas-wrapper">
    <canvas baseChart
      [data]="doughnutChartData"
      [options]="doughnutChartOptions"
      [type]="'doughnut'">
    </canvas>
    
    <div class="center-text">
      <span class="percent">{{ completionPercentage || 0}}%</span>
      <span class="label">готово</span>
    </div>
  </div>

  <div class="custom-legend">
    <div class="legend-item">
      <div class="dot success"></div>
      <span class="name">Готово</span>
      <span class="count">{{ stats.completedTasks }}</span>
    </div>
    
    <div class="legend-item">
      <div class="dot info"></div>
      <span class="name">В процессе</span>
      <span class="count">{{ stats.inProgressTasks }}</span>
    </div>
    
    <div class="legend-item">
      <div class="dot primary"></div>
      <span class="name">К выполнению</span>
      <span class="count">{{ stats.notStartedTasks }}</span>
    </div>
  </div>
</div>
