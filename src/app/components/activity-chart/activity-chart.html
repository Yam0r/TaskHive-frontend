<div class="chart-header">
  <div class="title-group">
    <h3 class="chart-title">{{ 'activity.title' | transloco }}</h3>
    <span class="chart-subtitle">{{ 'activity.subtitle' | transloco }}</span>
  </div>
</div>

<div class="chart-container">
  <canvas baseChart
    [data]="chart().data"
    [options]="chart().options"
    [type]="'bar'">
  </canvas>
</div>
