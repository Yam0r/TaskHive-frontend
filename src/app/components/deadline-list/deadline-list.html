<div class="list-header">
  <h3 class="list-title">{{ 'deadlines.title' | transloco }}</h3>
  <a routerLink="/tasks" class="list-link">{{ 'deadlines.allTasks' | transloco }} &rarr;</a>
</div>

<div class="list-content">
  @for (task of tasks(); track task.id) {
    <div class="task-item">
      <div class="dot" [class.active]="task.status === 'IN_PROGRESS'"></div>
      <div class="task-info">
        <span class="task-name">{{ task.name }}</span>
        <span class="task-category">{{ task.description }}</span>
      </div>
      <span class="task-date" [class.overdue]="isOverdue(task)">
        {{ 'deadlines.due' | transloco: { date: (task.dueDate | date: 'dd.MM') } }}
      </span>
    </div>
  } @empty {
    <p class="task-category">{{ 'deadlines.empty' | transloco }}</p>
  }
</div>
