<div class="sidebar-wrapper">
  <div class="logo-section">
    <div class="logo-icon">TH</div>
    <span class="logo-text">TaskHive</span>
  </div>

  @if (currentUser) {
    <div class="user-profile">
    <div class="avatar">{{ getInitials(currentUser.firstName, currentUser.lastName) }}</div>
    <div class="user-info">
      <span class="name">{{ currentUser.firstName }} {{ currentUser.lastName }}</span>
      <span class="email">{{ currentUser.email }}</span>
    </div>
  </div>
  }
  

  <nav class="nav-menu">
    <a routerLink="/dashboard" class="nav-item" routerLinkActive="active">
      <mat-icon>dashboard</mat-icon>
      <span>Дашборд</span>
    </a>

    <a routerLink="/tasks" class="nav-item" routerLinkActive="active">
      <mat-icon>list_alt</mat-icon>
      <span>Мои задачи</span>
      <span class="badge">0</span>
    </a>

    <a routerLink="/team" class="nav-item" routerLinkActive="active">
      <mat-icon>people</mat-icon>
      <span>Команда</span>
    </a>

    <a routerLink="/calendar" class="nav-item" routerLinkActive="active">
      <mat-icon>calendar_today</mat-icon>
      <span>Календарь</span>
    </a>

    <a routerLink="/settings" class="nav-item" routerLinkActive="active">
      <mat-icon>settings</mat-icon>
      <span>Настройки</span>
    </a>
  </nav>

  <div class="spacer"></div>

  <a class="nav-item logout" (click)="logout()">
    <mat-icon>exit_to_app</mat-icon>
    <span>Выйти</span>
  </a>
</div>
